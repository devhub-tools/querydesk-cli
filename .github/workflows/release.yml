name: Release

# Tag v<version>: v0.1.0-beta is a prerelease, v0.1.0 a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # versions follow the app's, with a fourth part for a client-only release (v2.46.1.1),
          # which isn't semver: skipping validation lets goreleaser take it
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
